## ── invoice-api ──────────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-api  
type: skupperx.io/component  
spec:  
  config:  
    replicas:  
      type: numeric  
      default: 2  
    selectorKey:  
      type: string-name  
      default: application  
    selectorValue:  
      type: string-name  
      default: invoice-api  
    logLevel:  
      type: enum  
      typeValues: [debug, info, warn, error]  
      default: info  
    enableMetrics:  
      type: bool  
      description: "Expose a Prometheus /metrics endpoint"  
      default: true  
    metricsPort:  
      type: numeric  
      default: 9090  
    imageVersion:  
      type: string  
      default: latest  
  interfaces:  
    http:  
      role: accept  
      data:  
        port: 8080  
    stock:  
      role: connect  
      data:  
        host: stock-svc  
        port: 8081  
    pricing:  
      role: connect  
      data:  
        host: pricing-svc  
        port: 8082  
    database:  
      role: connect  
      data:  
        host: invoice-db  
        port: 5432  
    queue:  
      role: connect  
      data:  
        host: redis  
        port: 6379  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: invoice-api-{{.ident}}  
        labels:  
          {{.selectorKey}}: {{.selectorValue}}  
          site: {{$site.name}}  
      spec:  
        replicas: {{.replicas}}  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: invoice-api  
              image: quay.io/example/invoice-api:{{.imageVersion}}  
              imagePullPolicy: Always  
              ports:  
              - containerPort: {{$localif.http.port}}  
                name: http  
              {{- if .enableMetrics}}  
              - containerPort: {{.metricsPort}}  
                name: metrics  
              {{- end}}  
              env:  
              - name: LOG_LEVEL  
                value: {{.logLevel}}  
              - name: SITE_NAME  
                value: {{$site.name}}  
              - name: STOCK_HOST  
                value: {{$localif.stock.host}}  
              - name: STOCK_PORT  
                value: "{{$localif.stock.port}}"  
              - name: PRICING_HOST  
                value: {{$localif.pricing.host}}  
              - name: PRICING_PORT  
                value: "{{$localif.pricing.port}}"  
              - name: DB_HOST  
                value: {{$localif.database.host}}  
              - name: DB_PORT  
                value: "{{$localif.database.port}}"  
              - name: REDIS_HOST  
                value: {{$localif.queue.host}}  
              - name: REDIS_PORT  
                value: "{{$localif.queue.port}}"  
              livenessProbe:  
                httpGet:  
                  path: /healthz  
                  port: {{$localif.http.port}}  
                initialDelaySeconds: 30  
                periodSeconds: 10  
      ---  
      apiVersion: v1  
      kind: Service  
      metadata:  
        name: invoice-api-{{.ident}}  
      spec:  
        selector:  
          {{.selectorKey}}: {{.selectorValue}}  
        ports:  
        - name: http  
          port: {{$localif.http.port}}  
          targetPort: {{$localif.http.port}}  
  
## ── stock-service ────────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: stock-service  
type: skupperx.io/component  
spec:  
  config:  
    replicas:  
      type: numeric  
      default: 1  
    selectorKey:  
      type: string-name  
      default: application  
    selectorValue:  
      type: string-name  
      default: stock-service  
    cacheEnabled:  
      type: bool  
      description: "Enable in-memory stock data cache"  
      default: true  
    cacheTTL:  
      type: numeric  
      description: "Cache TTL in seconds"  
      default: 300  
    imageVersion:  
      type: string  
      default: latest  
  interfaces:  
    http:  
      role: accept  
      data:  
        port: 8081  
    database:  
      role: connect  
      data:  
        host: stock-db  
        port: 5432  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: stock-service-{{.ident}}  
      spec:  
        replicas: {{.replicas}}  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: stock-service  
              image: quay.io/example/stock-service:{{.imageVersion}}  
              imagePullPolicy: Always  
              ports:  
              - containerPort: {{$localif.http.port}}  
              env:  
              - name: DB_HOST  
                value: {{$localif.database.host}}  
              - name: DB_PORT  
                value: "{{$localif.database.port}}"  
              - name: SITE_NAME  
                value: {{$site.name}}  
              {{- if .cacheEnabled}}  
              - name: CACHE_ENABLED  
                value: "true"  
              - name: CACHE_TTL  
                value: "{{.cacheTTL}}"  
              {{- else}}  
              - name: CACHE_ENABLED  
                value: "false"  
              {{- end}}  
              livenessProbe:  
                httpGet:  
                  path: /healthz  
                  port: {{$localif.http.port}}  
                initialDelaySeconds: 20  
                periodSeconds: 10  
  
