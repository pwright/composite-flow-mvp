## ── postgres/engine ──────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: postgres/engine  
type: skupperx.io/component  
spec:  
  config:  
    POSTGRES_DB:  
      type: string  
      default: postgres  
    POSTGRES_USER:  
      type: string  
      default: postgres  
    POSTGRES_PASSWORD:  
      type: string  
      default: postgres  
    imageVersion:  
      type: string  
      default: "15"  
    selectorKey:  
      type: string-name  
      default: block  
    selectorValue:  
      type: string-name  
      default: postgres  
  interfaces:  
    postgres:  
      role: accept  
      maxBindings: unlimited  
      data:  
        port: 5432  
    files:  
      role: mount  
      data:  
        volumeSize: 5Gi  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: postgres-{{.ident}}  
      spec:  
        replicas: 1  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: postgres  
              image: postgres:{{.imageVersion}}  
              imagePullPolicy: IfNotPresent  
              ports:  
              - containerPort: {{$localif.postgres.port}}  
              env:  
              - name: POSTGRES_DB  
                value: {{.POSTGRES_DB}}  
              - name: POSTGRES_USER  
                value: {{.POSTGRES_USER}}  
              - name: POSTGRES_PASSWORD  
                value: {{.POSTGRES_PASSWORD}}  
              volumeMounts:  
              - mountPath: /var/lib/postgresql/data  
                name: pgdata  
            volumes:  
            - name: pgdata  
              emptyDir:  
                sizeLimit: {{$localif.files.volumeSize}}  
  
## ── postgres/volume ──────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: postgres/volume  
type: skupperx.io/connector  # FIXED: was skupperx.io/component  
spec:  
  config:  
    storageClass:  
      type: string  
      default: standard  
    accessModes:              # FIXED: added missing accessModes config  
      type: string  
      default: ReadWriteOnce  
    capacity:  
      type: string  
      default: 5Gi  
    # FIXED: removed namePrefix — not part of the canonical schema;  
    #        PV/PVC names are derived from .ident  
  interfaces:  
    mountpoint:  
      role: mount  
      # FIXED: removed data block — canonical mountpoint has no data;  
      #        volumeSize comes from the bound block's interface data ($affif)  
  bodyStyle: simple  
  body:  
  - affinity: mountpoint      # FIXED: added affinity so resources deploy co-located  
    targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: v1  
      kind: PersistentVolume  
      metadata:  
        name: postgres-pv-{{.ident}}  
      spec:  
        storageClassName: {{.storageClass}}  
        capacity:  
          storage: {{.capacity}}  
        accessModes:  
        - {{.accessModes}}  
        hostPath:  
          path: "/mnt/data"  
      ---  
      apiVersion: v1  
      kind: PersistentVolumeClaim  
      metadata:  
        name: postgres-pvc-{{.ident}}  
      spec:  
        storageClassName: {{.storageClass}}  
        accessModes:  
        - {{.accessModes}}  
        resources:  
          requests:  
            storage: {{$affif.volumeSize}}  # FIXED: was $localif.files.volumeSize  
  
## ── library/tcp-connection ───────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: library/tcp-connection  
type: skupperx.io/connector  # FIXED: was skupperx.io/component  
spec:  
  config:  
    keyPrefix:  
      type: string-name       # FIXED: was type: string  
      default: tcp  
    protocol:  
      type: string-name       # FIXED: was type: string  
      default: tcp  
    connectorType:  
      type: enum  
      typeValues: ["host", "selector"]  # FIXED: was [selector, direct]  
      default: selector  
    distribution:  
      type: enum  
      typeValues: [balanced, closest]  
      default: balanced  
    priority:  
      type: enum              # FIXED: was type: string  
      typeValues: [lowest, "1", "2", "3", normal, "5", "6", "7", "8", "9", highest]  
      default: normal         # FIXED: was default: "5"  
    networkPolicyOnAcceptor:  
      type: bool  
      default: false  
    networkPolicyOnConnector:  
      type: bool  
      default: false  
    vanFlowTransport:  
      type: bool  
      default: false  
    vanFlowProtocol:  
      type: bool  
      default: false  
  interfaces:  
    acceptor:  
      role: accept  
    connector:  
      role: connect  
  bodyStyle: simple  
  body:  
  - affinity: [acceptor]      # FIXED: body now uses affinity-based templates  
    targetPlatforms: [sk2]  
    template: |  
      ---  
      apiVersion: skupper.io/v2alpha1  
      kind: Connector  
      metadata:  
        name: connector-{{.ident}}  
      spec:  
        type: tcp  
        selector: {{$affblock.selectorKey}}={{$affblock.selectorValue}}  
        port: {{$affif.port}}  
        routingKey: {{.keyPrefix}}{{.name}}  
      {{- if .networkPolicyOnAcceptor}}  
      ---  
      apiVersion: networking.k8s.io/v1  
      kind: NetworkPolicy  
      metadata:  
        name: ingress-policy-{{.ident}}  
      spec:  
        podSelector:  
          matchLabels:  
            {{$affblock.selectorKey}}: {{$affblock.selectorValue}}  
        policyTypes:  
        - Ingress  
        ingress:  
        - from:  
          - podSelector:  
              matchLabels:  
                skupper.io/component: router  
          ports:  
          - protocol: TCP  
            port: {{$affif.port}}  
      {{-end}}  
  - affinity: [connector]  
    targetPlatforms: [sk2]  
    template: |  
      ---  
      apiVersion: skupper.io/v2alpha1  
      kind: Listener  
      metadata:  
        name: listener-{{.ident}}  
      spec:  
        type: tcp  
        host: {{$affif.host}}  
        port: {{$affif.port}}  
        routingKey: {{.keyPrefix}}{{.name}}  
      {{- if .networkPolicyOnConnector}}  
      ---  
      apiVersion: networking.k8s.io/v1  
      kind: NetworkPolicy  
      metadata:  
        name: egress-policy-{{.ident}}  
      spec:  
        podSelector:  
          matchLabels:  
            {{$affblock.selectorKey}}: {{$affblock.selectorValue}}  
        policyTypes:  
        - Egress  
        egress:  
        - to:  
          - podSelector:  
              matchLabels:  
                skupper.io/component: router  
          ports:  
          - protocol: TCP  
            port: {{$affif.port}}  
      {{-end}}  
  
