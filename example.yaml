## ── redis/engine ─────────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: redis/engine  
type: skupperx.io/component  
spec:  
  config:  
    selectorKey:  
      type: string-name  
      default: block  
    selectorValue:  
      type: string-name  
      default: redis  
    maxMemory:  
      type: string  
      description: "Redis maxmemory setting, e.g. 256mb"  
      default: 256mb  
    evictionPolicy:  
      type: enum  
      typeValues: [noeviction, allkeys-lru, volatile-lru, allkeys-random, volatile-ttl]  
      default: allkeys-lru  
    imageVersion:  
      type: string  
      default: "7"  
  interfaces:  
    queue:  
      role: accept  
      maxBindings: unlimited  
      data:  
        port: 6379  
    files:  
      role: mount  
      data:  
        volumeSize: 2Gi  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: redis-{{.ident}}  
      spec:  
        replicas: 1  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: redis  
              image: redis:{{.imageVersion}}  
              imagePullPolicy: IfNotPresent  
              ports:  
              - containerPort: {{$localif.queue.port}}  
              command:  
              - redis-server  
              - --maxmemory  
              - {{.maxMemory}}  
              - --maxmemory-policy  
              - {{.evictionPolicy}}  
              volumeMounts:  
              - mountPath: /data  
                name: redis-data  
            volumes:  
            - name: redis-data  
              emptyDir:  
                sizeLimit: {{$localif.files.volumeSize}}  
  
## ── invoice-worker ───────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-worker  
type: skupperx.io/component  
spec:  
  config:  
    replicas:  
      type: numeric  
      description: "Parallel worker replicas"  
      default: 1  
    selectorKey:  
      type: string-name  
      default: application  
    selectorValue:  
      type: string-name  
      default: invoice-worker  
    batchSize:  
      type: numeric  
      description: "Invoices processed per batch"  
      default: 10  
    enableRetry:  
      type: bool  
      default: true  
    maxRetries:  
      type: numeric  
      default: 3  
    imageVersion:  
      type: string  
      default: latest  
  interfaces:  
    queue:  
      role: connect  
      data:  
        host: redis  
        port: 6379  
    database:  
      role: connect  
      data:  
        host: invoice-db  
        port: 5432  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: invoice-worker-{{.ident}}  
      spec:  
        replicas: {{.replicas}}  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: invoice-worker  
              image: quay.io/example/invoice-worker:{{.imageVersion}}  
              imagePullPolicy: Always  
              env:  
              - name: REDIS_HOST  
                value: {{$localif.queue.host}}  
              - name: REDIS_PORT  
                value: "{{$localif.queue.port}}"  
              - name: DB_HOST  
                value: {{$localif.database.host}}  
              - name: DB_PORT  
                value: "{{$localif.database.port}}"  
              - name: BATCH_SIZE  
                value: "{{.batchSize}}"  
              - name: SITE_NAME  
                value: {{$site.name}}  
              {{- if .enableRetry}}  
              - name: ENABLE_RETRY  
                value: "true"  
              - name: MAX_RETRIES  
                value: "{{.maxRetries}}"  
              {{- else}}  
              - name: ENABLE_RETRY  
                value: "false"  
              {{- end}}  
  
## ── invoice-api/ingress ──────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-api/ingress  
type: skupperx.io/ingress  
spec:  
  config:  
    hostname:  
      type: string  
      default: invoice.example.com  
    namePrefix:  
      type: string-name  
      default: invoice-ingress  
    tlsEnabled:  
      type: bool  
      default: true  
    tlsSecretName:  
      type: string  
      default: invoice-tls-secret  
  interfaces:  
    connector:  
      role: connect  
      data:  
        host: invoice-api  
        port: 8080  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: networking.k8s.io/v1  
      kind: Ingress  
      metadata:  
        name: {{.namePrefix}}-{{.ident}}  
        annotations:  
          nginx.ingress.kubernetes.io/rewrite-target: /  
      spec:  
        ingressClassName: nginx  
        {{- if .tlsEnabled}}  
        tls:  
        - hosts:  
          - {{.hostname}}  
          secretName: {{.tlsSecretName}}  
        {{- end}}  
        rules:  
        - host: {{.hostname}}  
          http:  
            paths:  
            - path: /  
              pathType: Prefix  
              backend:  
                service:  
                  name: {{$localif.connector.host}}  
                  port:  
                    number: {{$localif.connector.port}}  
  
## ── stock-service/subsystem ──────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: stock-service/subsystem  
type: skupperx.io/component  
spec:  
  interfaces:  
    http:  
      role: accept  
  bodyStyle: composite  
  body:  
    service:  
      block: stock-service  
      siteClasses:  
      - worker  
      bindings:  
        http:  
          super: http  
    db:  
      block: postgres/engine  
      siteClasses:  
      - hq  
      config:  
        POSTGRES_DB: stock-db  
        POSTGRES_USER: stockuser  
        POSTGRES_PASSWORD: stockpass  
    store:  
      block: postgres/volume  
      bindings:  
        mountpoint:  
          block: db  
          blockInterface: files  
    svc-to-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: stock-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
        networkPolicyOnConnector: true  
      bindings:  
        connector:  
          block: service  
          blockInterface: database  
        acceptor:  
          block: db  
          blockInterface: postgres  
  
