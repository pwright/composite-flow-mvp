##  
## INVOICE PROCESSING PLATFORM — End-to-End VMS Example  
##  
## Reuses from library (already in tests/blocks.yaml):  
##   library/tcp-connection, postgres/engine, postgres/volume  
##  
## Site Classes:  
##   hq     — Central datacenter: databases, Redis queue  
##   api    — DMZ / edge: API gateway, ingress  
##   worker — Compute: microservices, background workers  
##  
## Block hierarchy:  
##   invoice-platform  (toplevel)  
##   ├── invoice-api/ingress          (ingress)  
##   ├── invoice-api                  (component)  
##   ├── stock-service/subsystem      (composite component)  
##   │   ├── stock-service            (component)  
##   │   ├── postgres/engine          [library]  
##   │   ├── postgres/volume          [library]  
##   │   └── library/tcp-connection   [library]  
##   ├── pricing-service/subsystem    (composite component)  
##   │   ├── pricing-service          (component)  
##   │   ├── postgres/engine          [library]  
##   │   ├── postgres/volume          [library]  
##   │   └── library/tcp-connection   [library]  
##   ├── redis/engine                 (component)  
##   ├── invoice-worker               (component)  
##   ├── postgres/engine              [library] — invoice DB  
##   ├── postgres/volume              [library]  
##   └── library/tcp-connection x5   [library] — all cross-service links  
##  
  
## ============================================================
## LIBRARY BLOCKS
## These are reusable building blocks referenced by the platform
## ============================================================

## ── postgres/engine ──────────────────────────────────────────
## PostgreSQL database engine
---
apiVersion: skupperx.io/compose/v1alpha1
kind: Block
metadata:
  name: postgres/engine
type: skupperx.io/component
spec:
  config:
    POSTGRES_DB:
      type: string
      default: postgres
    POSTGRES_USER:
      type: string
      default: postgres
    POSTGRES_PASSWORD:
      type: string
      default: postgres
    imageVersion:
      type: string
      default: "15"
    selectorKey:
      type: string-name
      default: block
    selectorValue:
      type: string-name
      default: postgres
  interfaces:
    postgres:
      role: accept
      maxBindings: unlimited
      data:
        port: 5432
    files:
      role: mount
      data:
        volumeSize: 5Gi
  bodyStyle: simple
  body:
  - targetPlatforms: [sk2, kube]
    template: |
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: postgres-{{.ident}}
      spec:
        replicas: 1
        selector:
          matchLabels:
            {{.selectorKey}}: {{.selectorValue}}
        template:
          metadata:
            labels:
              {{.selectorKey}}: {{.selectorValue}}
          spec:
            containers:
            - name: postgres
              image: postgres:{{.imageVersion}}
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: {{$localif.postgres.port}}
              env:
              - name: POSTGRES_DB
                value: {{.POSTGRES_DB}}
              - name: POSTGRES_USER
                value: {{.POSTGRES_USER}}
              - name: POSTGRES_PASSWORD
                value: {{.POSTGRES_PASSWORD}}
              volumeMounts:
              - mountPath: /var/lib/postgresql/data
                name: pgdata
            volumes:
            - name: pgdata
              emptyDir:
                sizeLimit: {{$localif.files.volumeSize}}

## ── postgres/volume ──────────────────────────────────────────
## Persistent volume for PostgreSQL data
---
apiVersion: skupperx.io/compose/v1alpha1
kind: Block
metadata:
  name: postgres/volume
type: skupperx.io/component
spec:
  config:
    storageClass:
      type: string
      default: standard
    capacity:
      type: string
      default: 5Gi
    namePrefix:
      type: string-name
      default: postgres-pvc
  interfaces:
    mountpoint:
      role: mount
      data:
        volumeSize: 5Gi
  bodyStyle: simple
  body:
  - targetPlatforms: [sk2, kube]
    template: |
      ---
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{.namePrefix}}-{{.ident}}
      spec:
        accessModes:
        - ReadWriteOnce
        storageClassName: {{.storageClass}}
        resources:
          requests:
            storage: {{.capacity}}

## ── library/tcp-connection ───────────────────────────────────
## TCP connection binding between components
---
apiVersion: skupperx.io/compose/v1alpha1
kind: Block
metadata:
  name: library/tcp-connection
type: skupperx.io/component
spec:
  config:
    keyPrefix:
      type: string-name
      default: tcp
    protocol:
      type: string
      default: tcp
    connectorType:
      type: enum
      typeValues: [selector, direct]
      default: selector
    distribution:
      type: enum
      typeValues: [balanced, closest]
      default: balanced
    priority:
      type: string
      default: "5"
    networkPolicyOnAcceptor:
      type: bool
      default: false
    networkPolicyOnConnector:
      type: bool
      default: false
    vanFlowTransport:
      type: bool
      default: false
    vanFlowProtocol:
      type: bool
      default: false
  interfaces:
    acceptor:
      role: accept
    connector:
      role: connect
  bodyStyle: simple
  body:
  - targetPlatforms: [sk2]
    description: "Skupper TCP connector configuration"
    template: |
      # Skupper connector: {{.keyPrefix}}-{{.ident}}
      # Protocol: {{.protocol}}
      # Distribution: {{.distribution}}
      # Priority: {{.priority}}

## ============================================================
## APPLICATION BLOCKS
## ============================================================

## ============================================================
## BLOCK 1: invoice-api
## Type: skupperx.io/component  |  bodyStyle: simple
##
## Features demonstrated:
##   - Multiple interfaces: one accept + four connect
##   - All config types: string, string-name, numeric, bool, enum
##   - $localif.<name> for every connect interface
##   - $site.name for site-aware labelling
##   - Conditional template block ({{-if}} / {{-else}} / {{-end}})
##   - targetPlatforms
## ============================================================

---
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-api  
type: skupperx.io/component  
spec:  
  config:  
    replicas:  
      type: numeric  
      default: 2  
    selectorKey:  
      type: string-name  
      default: application  
    selectorValue:  
      type: string-name  
      default: invoice-api  
    logLevel:  
      type: enum  
      typeValues: [debug, info, warn, error]  
      default: info  
    enableMetrics:  
      type: bool  
      description: "Expose a Prometheus /metrics endpoint"  
      default: true  
    metricsPort:  
      type: numeric  
      default: 9090  
    imageVersion:  
      type: string  
      default: latest  
  interfaces:  
    http:  
      role: accept  
      data:  
        port: 8080  
    stock:  
      role: connect  
      data:  
        host: stock-svc  
        port: 8081  
    pricing:  
      role: connect  
      data:  
        host: pricing-svc  
        port: 8082  
    database:  
      role: connect  
      data:  
        host: invoice-db  
        port: 5432  
    queue:  
      role: connect  
      data:  
        host: redis  
        port: 6379  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: invoice-api-{{.ident}}  
        labels:  
          {{.selectorKey}}: {{.selectorValue}}  
          site: {{$site.name}}  
      spec:  
        replicas: {{.replicas}}  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: invoice-api  
              image: quay.io/example/invoice-api:{{.imageVersion}}  
              imagePullPolicy: Always  
              ports:  
              - containerPort: {{$localif.http.port}}  
                name: http  
              {{- if .enableMetrics}}  
              - containerPort: {{.metricsPort}}  
                name: metrics  
              {{- end}}  
              env:  
              - name: LOG_LEVEL  
                value: {{.logLevel}}  
              - name: SITE_NAME  
                value: {{$site.name}}  
              - name: STOCK_HOST  
                value: {{$localif.stock.host}}  
              - name: STOCK_PORT  
                value: "{{$localif.stock.port}}"  
              - name: PRICING_HOST  
                value: {{$localif.pricing.host}}  
              - name: PRICING_PORT  
                value: "{{$localif.pricing.port}}"  
              - name: DB_HOST  
                value: {{$localif.database.host}}  
              - name: DB_PORT  
                value: "{{$localif.database.port}}"  
              - name: REDIS_HOST  
                value: {{$localif.queue.host}}  
              - name: REDIS_PORT  
                value: "{{$localif.queue.port}}"  
              livenessProbe:  
                httpGet:  
                  path: /healthz  
                  port: {{$localif.http.port}}  
                initialDelaySeconds: 30  
                periodSeconds: 10  
      ---  
      apiVersion: v1  
      kind: Service  
      metadata:  
        name: invoice-api-{{.ident}}  
      spec:  
        selector:  
          {{.selectorKey}}: {{.selectorValue}}  
        ports:  
        - name: http  
          port: {{$localif.http.port}}  
          targetPort: {{$localif.http.port}}  
  
## ============================================================  
## BLOCK 2: stock-service  
## Type: skupperx.io/component  |  bodyStyle: simple  
##  
## Features demonstrated:  
##   - bool config (cacheEnabled) driving a conditional env block  
##   - numeric config (cacheTTL)  
##   - $localif for a connect interface  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: stock-service  
type: skupperx.io/component  
spec:  
  config:  
    replicas:  
      type: numeric  
      default: 1  
    selectorKey:  
      type: string-name  
      default: application  
    selectorValue:  
      type: string-name  
      default: stock-service  
    cacheEnabled:  
      type: bool  
      description: "Enable in-memory stock data cache"  
      default: true  
    cacheTTL:  
      type: numeric  
      description: "Cache TTL in seconds"  
      default: 300  
    imageVersion:  
      type: string  
      default: latest  
  interfaces:  
    http:  
      role: accept  
      data:  
        port: 8081  
    database:  
      role: connect  
      data:  
        host: stock-db  
        port: 5432  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: stock-service-{{.ident}}  
      spec:  
        replicas: {{.replicas}}  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: stock-service  
              image: quay.io/example/stock-service:{{.imageVersion}}  
              imagePullPolicy: Always  
              ports:  
              - containerPort: {{$localif.http.port}}  
              env:  
              - name: DB_HOST  
                value: {{$localif.database.host}}  
              - name: DB_PORT  
                value: "{{$localif.database.port}}"  
              - name: SITE_NAME  
                value: {{$site.name}}  
              {{- if .cacheEnabled}}  
              - name: CACHE_ENABLED  
                value: "true"  
              - name: CACHE_TTL  
                value: "{{.cacheTTL}}"  
              {{- else}}  
              - name: CACHE_ENABLED  
                value: "false"  
              {{- end}}  
              livenessProbe:  
                httpGet:  
                  path: /healthz  
                  port: {{$localif.http.port}}  
                initialDelaySeconds: 20  
                periodSeconds: 10  
  
