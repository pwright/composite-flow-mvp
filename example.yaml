## ── invoice-platform ─────────────────────────────────────────  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-platform  
type: skupperx.io/toplevel  
spec:  
  bodyStyle: composite  
  body:  
  
    ingress:  
      block: invoice-api/ingress  
      siteClasses:  
      - api  
      config:  
        hostname: invoice.example.com  
        tlsEnabled: true  
  
    api:  
      block: invoice-api  
      siteClasses:  
      - api  
      config:  
        replicas: 3  
        logLevel: warn  
        enableMetrics: true  
  
    stock:  
      block: stock-service/subsystem  
      siteClasses:  
      - worker  
      - hq  
  
    pricing:  
      block: pricing-service/subsystem  
      siteClasses:  
      - worker  
      - hq  
  
    invoice-db:  
      block: postgres/engine  
      siteClasses:  
      - hq  
      config:  
        POSTGRES_DB: invoices  
        POSTGRES_USER: invoiceuser  
        POSTGRES_PASSWORD: invoicepass  
        imageVersion: "15"  
  
    invoice-store:  
      block: postgres/volume  
      config:  
        storageClass: ibmc-vpc-block-10iops-tier  
        capacity: 20Gi  
      bindings:  
        mountpoint:  
          block: invoice-db  
          blockInterface: files  
  
    queue:  
      block: redis/engine  
      siteClasses:  
      - hq  
      config:  
        maxMemory: 512mb  
        evictionPolicy: allkeys-lru  
  
    worker:  
      block: invoice-worker  
      siteClasses:  
      - worker  
      config:  
        replicas: 3  
        batchSize: 25  
        enableRetry: true  
        maxRetries: 5  
  
    ingress-to-api:  
      block: library/tcp-connection  
      config:  
        keyPrefix: http-ingress  
        protocol: http  
        connectorType: selector  
      bindings:  
        acceptor:  
          block: api  
          blockInterface: http  
        connector:  
          block: ingress  
          blockInterface: connector  
  
    api-to-stock:  
      block: library/tcp-connection  
      config:  
        keyPrefix: stock-http  
        protocol: http  
        connectorType: selector  
        distribution: closest  
        priority: "7"  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: stock  
          blockInterface: http  
        connector:  
          block: api  
          blockInterface: stock  
  
    api-to-pricing:  
      block: library/tcp-connection  
      config:  
        keyPrefix: pricing-http  
        protocol: http  
        connectorType: selector  
        distribution: balanced  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: pricing  
          blockInterface: http  
        connector:  
          block: api  
          blockInterface: pricing  
  
    api-to-invoice-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: invoice-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
        networkPolicyOnConnector: true  
      bindings:  
        acceptor:  
          block: invoice-db  
          blockInterface: postgres  
        connector:  
          block: api  
          blockInterface: database  
  
    api-to-queue:  
      block: library/tcp-connection  
      config:  
        keyPrefix: api-redis  
        protocol: redis  
        connectorType: selector  
        vanFlowTransport: true  
        vanFlowProtocol: true  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: queue  
          blockInterface: queue  
        connector:  
          block: api  
          blockInterface: queue  
  
    worker-to-invoice-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: worker-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
        networkPolicyOnConnector: true  
      bindings:  
        acceptor:  
          block: invoice-db  
          blockInterface: postgres  
        connector:  
          block: worker  
          blockInterface: database  
  
    worker-to-queue:  
      block: library/tcp-connection  
      config:  
        keyPrefix: worker-redis  
        protocol: redis  
        connectorType: selector  
        vanFlowTransport: true  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: queue  
          blockInterface: queue  
        connector:  
          block: worker  
          blockInterface: queue