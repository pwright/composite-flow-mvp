## ============================================================  
## BLOCK 4: redis/engine  
## Type: skupperx.io/component  |  bodyStyle: simple  
##  
## Features demonstrated:  
##   - maxBindings: unlimited  (multiple clients can bind to queue)  
##   - mount interface (files) — same pattern as postgres/engine  
##   - enum config (evictionPolicy)  
##   - string config (maxMemory)  
##   - $localif.files.volumeSize from the mount interface  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: redis/engine  
type: skupperx.io/component  
spec:  
  config:  
    selectorKey:  
      type: string-name  
      default: block  
    selectorValue:  
      type: string-name  
      default: redis  
    maxMemory:  
      type: string  
      description: "Redis maxmemory setting, e.g. 256mb"  
      default: 256mb  
    evictionPolicy:  
      type: enum  
      typeValues: [noeviction, allkeys-lru, volatile-lru, allkeys-random, volatile-ttl]  
      default: allkeys-lru  
    imageVersion:  
      type: string  
      default: "7"  
  interfaces:  
    queue:  
      role: accept  
      maxBindings: unlimited  
      data:  
        port: 6379  
    files:  
      role: mount  
      data:  
        volumeSize: 2Gi  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: redis-{{.ident}}  
      spec:  
        replicas: 1  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: redis  
              image: redis:{{.imageVersion}}  
              imagePullPolicy: IfNotPresent  
              ports:  
              - containerPort: {{$localif.queue.port}}  
              command:  
              - redis-server  
              - --maxmemory  
              - {{.maxMemory}}  
              - --maxmemory-policy  
              - {{.evictionPolicy}}  
              volumeMounts:  
              - mountPath: /data  
                name: redis-data  
            volumes:  
            - name: redis-data  
              emptyDir:  
                sizeLimit: {{$localif.files.volumeSize}}  
  
## ============================================================  
## BLOCK 5: invoice-worker  
## Type: skupperx.io/component  |  bodyStyle: simple  
##  
## Features demonstrated:  
##   - Two connect interfaces (queue + database)  
##   - bool + numeric config combination (enableRetry / maxRetries)  
##   - Conditional env vars driven by enableRetry  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-worker  
type: skupperx.io/component  
spec:  
  config:  
    replicas:  
      type: numeric  
      description: "Parallel worker replicas"  
      default: 1  
    selectorKey:  
      type: string-name  
      default: application  
    selectorValue:  
      type: string-name  
      default: invoice-worker  
    batchSize:  
      type: numeric  
      description: "Invoices processed per batch"  
      default: 10  
    enableRetry:  
      type: bool  
      default: true  
    maxRetries:  
      type: numeric  
      default: 3  
    imageVersion:  
      type: string  
      default: latest  
  interfaces:  
    queue:  
      role: connect  
      data:  
        host: redis  
        port: 6379  
    database:  
      role: connect  
      data:  
        host: invoice-db  
        port: 5432  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: apps/v1  
      kind: Deployment  
      metadata:  
        name: invoice-worker-{{.ident}}  
      spec:  
        replicas: {{.replicas}}  
        selector:  
          matchLabels:  
            {{.selectorKey}}: {{.selectorValue}}  
        template:  
          metadata:  
            labels:  
              {{.selectorKey}}: {{.selectorValue}}  
          spec:  
            containers:  
            - name: invoice-worker  
              image: quay.io/example/invoice-worker:{{.imageVersion}}  
              imagePullPolicy: Always  
              env:  
              - name: REDIS_HOST  
                value: {{$localif.queue.host}}  
              - name: REDIS_PORT  
                value: "{{$localif.queue.port}}"  
              - name: DB_HOST  
                value: {{$localif.database.host}}  
              - name: DB_PORT  
                value: "{{$localif.database.port}}"  
              - name: BATCH_SIZE  
                value: "{{.batchSize}}"  
              - name: SITE_NAME  
                value: {{$site.name}}  
              {{- if .enableRetry}}  
              - name: ENABLE_RETRY  
                value: "true"  
              - name: MAX_RETRIES  
                value: "{{.maxRetries}}"  
              {{- else}}  
              - name: ENABLE_RETRY  
                value: "false"  
              {{- end}}  
  
## ============================================================  
## BLOCK 6: invoice-api/ingress  
## Type: skupperx.io/ingress  |  bodyStyle: simple  
##  
## Features demonstrated:  
##   - skupperx.io/ingress block type  
##   - bool config (tlsEnabled) driving a conditional TLS spec  
##   - $localif on a connect interface  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-api/ingress  
type: skupperx.io/ingress  
spec:  
  config:  
    hostname:  
      type: string  
      default: invoice.example.com  
    namePrefix:  
      type: string-name  
      default: invoice-ingress  
    tlsEnabled:  
      type: bool  
      default: true  
    tlsSecretName:  
      type: string  
      default: invoice-tls-secret  
  interfaces:  
    connector:  
      role: connect  
      data:  
        host: invoice-api  
        port: 8080  
  bodyStyle: simple  
  body:  
  - targetPlatforms: [sk2, kube]  
    template: |  
      ---  
      apiVersion: networking.k8s.io/v1  
      kind: Ingress  
      metadata:  
        name: {{.namePrefix}}-{{.ident}}  
        annotations:  
          nginx.ingress.kubernetes.io/rewrite-target: /  
      spec:  
        ingressClassName: nginx  
        {{- if .tlsEnabled}}  
        tls:  
        - hosts:  
          - {{.hostname}}  
          secretName: {{.tlsSecretName}}  
        {{- end}}  
        rules:  
        - host: {{.hostname}}  
          http:  
            paths:  
            - path: /  
              pathType: Prefix  
              backend:  
                service:  
                  name: {{$localif.connector.host}}  
                  port:  
                    number: {{$localif.connector.port}}  
  
## ============================================================  
## BLOCK 7: stock-service/subsystem  
## Type: skupperx.io/component  |  bodyStyle: composite  
##  
## Features demonstrated:  
##   - Composite block encapsulating a service + its own DB  
##   - super binding: exposes stock-service's http interface  
##     upward so the parent can bind to it  
##   - Internal wiring via library/tcp-connection  
##   - siteClasses per child (worker vs hq)  
##   - config override on a child block (POSTGRES_DB)  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: stock-service/subsystem  
type: skupperx.io/component  
spec:  
  interfaces:  
    http:  
      role: accept  
  bodyStyle: composite  
  body:  
    service:  
      block: stock-service  
      siteClasses:  
      - worker  
      bindings:  
        http:  
          super: http          # propagates http up to the subsystem boundary  
    db:  
      block: postgres/engine  
      siteClasses:  
      - hq  
      config:  
        POSTGRES_DB: stock-db  
        POSTGRES_USER: stockuser  
        POSTGRES_PASSWORD: stockpass  
    store:  
      block: postgres/volume  
      bindings:  
        mountpoint:  
          block: db  
          blockInterface: files  
    svc-to-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: stock-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
        networkPolicyOnConnector: true  
      bindings:  
        connector:  
          block: service  
          blockInterface: database  
        acceptor:  
          block: db  
          blockInterface: postgres  
  
## ============================================================  
## BLOCK 8: pricing-service/subsystem  
## Type: skupperx.io/component  |  bodyStyle: composite  
##  
## Features demonstrated:  
##   - Same composite pattern as stock-service/subsystem  
##   - config override on child: pricingStrategy set to dynamic  
##     (overrides the block's default of "standard")  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: pricing-service/subsystem  
type: skupperx.io/component  
spec:  
  interfaces:  
    http:  
      role: accept  
  bodyStyle: composite  
  body:  
    service:  
      block: pricing-service  
      siteClasses:  
      - worker  
      config:  
        pricingStrategy: dynamic   # override default "standard"  
      bindings:  
        http:  
          super: http  
    db:  
      block: postgres/engine  
      siteClasses:  
      - hq  
      config:  
        POSTGRES_DB: pricing-db  
        POSTGRES_USER: pricinguser  
        POSTGRES_PASSWORD: pricingpass  
    store:  
      block: postgres/volume  
      bindings:  
        mountpoint:  
          block: db  
          blockInterface: files  
    svc-to-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: pricing-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
      bindings:  
        connector:  
          block: service  
          blockInterface: database  
        acceptor:  
          block: db  
          blockInterface: postgres  
  
## ============================================================  
## BLOCK 9: invoice-platform  
## Type: skupperx.io/toplevel  |  bodyStyle: composite  
##  
## Features demonstrated:  
##   - skupperx.io/toplevel block type (root of the application)  
##   - Nested composite blocks (subsystems) alongside leaf blocks  
##   - siteClasses on every child  
##   - config overrides at the toplevel (replicas, logLevel, etc.)  
##   - distribution: closest + priority on latency-sensitive path  
##   - vanFlowTransport + vanFlowProtocol on the queue connections  
##   - networkPolicyOnAcceptor + networkPolicyOnConnector on DB links  
##   - Binding to an interface exposed via super (stock.http,  
##     pricing.http are propagated up from the subsystems)  
## ============================================================  
  
---  
apiVersion: skupperx.io/compose/v1alpha1  
kind: Block  
metadata:  
  name: invoice-platform  
type: skupperx.io/toplevel  
spec:  
  bodyStyle: composite  
  body:  
  
    ## ── Ingress ──────────────────────────────────────────────  
    ingress:  
      block: invoice-api/ingress  
      siteClasses:  
      - api  
      config:  
        hostname: invoice.example.com  
        tlsEnabled: true  
  
    ## ── API layer ────────────────────────────────────────────  
    api:  
      block: invoice-api  
      siteClasses:  
      - api  
      config:  
        replicas: 3  
        logLevel: warn  
        enableMetrics: true  
  
    ## ── Microservice subsystems (each bundles service + DB) ──  
    stock:  
      block: stock-service/subsystem  
      siteClasses:  
      - worker  
      - hq  
  
    pricing:  
      block: pricing-service/subsystem  
      siteClasses:  
      - worker  
      - hq  
  
    ## ── Invoice database ─────────────────────────────────────  
    invoice-db:  
      block: postgres/engine  
      siteClasses:  
      - hq  
      config:  
        POSTGRES_DB: invoices  
        POSTGRES_USER: invoiceuser  
        POSTGRES_PASSWORD: invoicepass  
        imageVersion: "15"  
  
    invoice-store:  
      block: postgres/volume  
      config:  
        storageClass: ibmc-vpc-block-10iops-tier  
        capacity: 20Gi  
      bindings:  
        mountpoint:  
          block: invoice-db  
          blockInterface: files  
  
    ## ── Redis message queue ───────────────────────────────────  
    queue:  
      block: redis/engine  
      siteClasses:  
      - hq  
      config:  
        maxMemory: 512mb  
        evictionPolicy: allkeys-lru  
  
    ## ── Background workers ───────────────────────────────────  
    worker:  
      block: invoice-worker  
      siteClasses:  
      - worker  
      config:  
        replicas: 3  
        batchSize: 25  
        enableRetry: true  
        maxRetries: 5  
  
    ## ── Connections ──────────────────────────────────────────  
  
    # External ingress → API  
    ingress-to-api:  
      block: library/tcp-connection  
      config:  
        keyPrefix: http-ingress  
        protocol: http  
        connectorType: selector  
      bindings:  
        acceptor:  
          block: api  
          blockInterface: http  
        connector:  
          block: ingress  
          blockInterface: connector  
  
    # API → Stock service  
    # distribution: closest reduces latency for synchronous lookups  
    # priority: "7" gives this path preferential forwarding  
    api-to-stock:  
      block: library/tcp-connection  
      config:  
        keyPrefix: stock-http  
        protocol: http  
        connectorType: selector  
        distribution: closest  
        priority: "7"  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: stock          # binds to the http interface propagated  
          blockInterface: http  # up from stock-service/subsystem via super  
        connector:  
          block: api  
          blockInterface: stock  
  
    # API → Pricing service  
    api-to-pricing:  
      block: library/tcp-connection  
      config:  
        keyPrefix: pricing-http  
        protocol: http  
        connectorType: selector  
        distribution: balanced  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: pricing  
          blockInterface: http  
        connector:  
          block: api  
          blockInterface: pricing  
  
    # API → Invoice database  
    # Both-side network policies lock down DB access  
    api-to-invoice-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: invoice-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
        networkPolicyOnConnector: true  
      bindings:  
        acceptor:  
          block: invoice-db  
          blockInterface: postgres  
        connector:  
          block: api  
          blockInterface: database  
  
    # API → Redis queue  
    # vanFlow enabled for observability on the async path  
    api-to-queue:  
      block: library/tcp-connection  
      config:  
        keyPrefix: api-redis  
        protocol: redis  
        connectorType: selector  
        vanFlowTransport: true  
        vanFlowProtocol: true  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: queue  
          blockInterface: queue  
        connector:  
          block: api  
          blockInterface: queue  
  
    # Worker → Invoice database  
    worker-to-invoice-db:  
      block: library/tcp-connection  
      config:  
        keyPrefix: worker-pg  
        protocol: postgres  
        connectorType: selector  
        networkPolicyOnAcceptor: true  
        networkPolicyOnConnector: true  
      bindings:  
        acceptor:  
          block: invoice-db  
          blockInterface: postgres  
        connector:  
          block: worker  
          blockInterface: database  
  
    # Worker → Redis queue  
    worker-to-queue:  
      block: library/tcp-connection  
      config:  
        keyPrefix: worker-redis  
        protocol: redis  
        connectorType: selector  
        vanFlowTransport: true  
        networkPolicyOnAcceptor: true  
      bindings:  
        acceptor:  
          block: queue  
          blockInterface: queue  
        connector:  
          block: worker  
          blockInterface: queue
          